<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent vs Buy Calculator | Free Financial Tool</title>
    <meta name="description" content="Calculate your long-term net worth with our free Rent vs Buy Calculator. Compare mortgage payments, equity growth, rent increases, and investment returns instantly.">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --text: #1f2937;
            --border: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .results {
            grid-column: 1 / -1;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .verdict { color: var(--primary); font-size: 1.5rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Rent vs. Buy Wealth Calculator</h1>
    
    <div class="grid">
        <!-- Renting Side -->
        <div class="section">
            <h2>Renting Scenario</h2>
            <div class="input-group">
                <label>Monthly Rent (\$)</label>
                <input type="number" id="monthlyRent" value="1500" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Annual Rent Increase (%)</label>
                <input type="number" id="rentIncrease" value="3" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Annual Return on Savings/Investments (%)</label>
                <input type="number" id="investmentReturn" value="7" oninput="calculate()">
            </div>
        </div>

        <!-- Buying Side -->
        <div class="section">
            <h2>Buying Scenario</h2>
            <div class="input-group">
                <label>Home Purchase Price (\$)</label>
                <input type="number" id="homePrice" value="350000" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Down Payment (\$)</label>
                <input type="number" id="downPayment" value="35000" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Mortgage Interest Rate (%)</label>
                <input type="number" id="interestRate" value="6.5" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Annual Home Appreciation (%)</label>
                <input type="number" id="appreciation" value="4" oninput="calculate()">
            </div>
        </div>

        <!-- Shared Timeline Slider -->
        <div class="section" style="grid-column: 1 / -1;">
            <label style="text-align: center;">Timeline: <span id="yearsDisplay">10</span> Years</label>
            <input type="range" id="years" min="1" max="30" value="10" style="width:100%" oninput="document.getElementById('yearsDisplay').innerText = this.value; calculate();">
        </div>

        <!-- Dynamic Output Summary -->
        <div class="results">
            <div id="summaryText">Calculating net financial impact...</div>
            <div id="verdictText" class="verdict"></div>
        </div>
    </div>
</div>

<script>
function calculate() {
    let rent = parseFloat(document.getElementById('monthlyRent').value) || 0;
    let rentInc = (parseFloat(document.getElementById('rentIncrease').value) || 0) / 100;
    let invReturn = (parseFloat(document.getElementById('investmentReturn').value) || 0) / 100;
    
    let price = parseFloat(document.getElementById('homePrice').value) || 0;
    let downPay = parseFloat(document.getElementById('downPayment').value) || 0;
    let rate = (parseFloat(document.getElementById('interestRate').value) || 0) / 100;
    let apprec = (parseFloat(document.getElementById('appreciation').value) || 0) / 100;
    
    let years = parseInt(document.getElementById('years').value) || 10;

    let totalRentPaid = 0;
    let currentRent = rent;
    for(let i=0; i<years; i++) {
        totalRentPaid += (currentRent * 12);
        currentRent *= (1 + rentInc);
    }
    let renterInvestmentWealth = downPay * Math.pow((1 + invReturn), years);
    let renterNetPosition = renterInvestmentWealth - totalRentPaid;

    let futureHomeValue = price * Math.pow((1 + apprec), years);
    
    let loanAmount = price - downPay;
    let monthlyRate = rate / 12;
    let totalMonths = 30 * 12;
    let paymentMonths = years * 12;
    
    let monthlyPayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
    let totalMortgagePaid = monthlyPayment * paymentMonths;
    
    let remainingBalance = loanAmount;
    if (rate > 0) {
        remainingBalance = loanAmount * (Math.pow(1 + monthlyRate, totalMonths) - Math.pow(1 + monthlyRate, paymentMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
    } else {
        remainingBalance = loanAmount * (1 - (paymentMonths / totalMonths));
    }
    if(remainingBalance < 0 || paymentMonths >= totalMonths) remainingBalance = 0;

    let buyerEquity = futureHomeValue - remainingBalance;
    let buyerNetPosition = buyerEquity - totalMortgagePaid;

    let difference = Math.abs(buyerNetPosition - renterNetPosition).toLocaleString(undefined, {maximumFractionDigits: 0});
    let summaryText = "";
    let verdictText = "";

    if (buyerNetPosition > renterNetPosition) {
        summaryText = `Over a ${years}-year period, buying builds more net worth than renting.`;
        verdictText = `Buying wins by roughly $${difference}!`;
    } else {
        summaryText = `Over a ${years}-year period, renting and investing the difference leaves you with more cash.`;
        verdictText = `Renting wins by roughly $${difference}!`;
    }

    document.getElementById('summaryText').innerText = summaryText;
    document.getElementById('verdictText').innerText = verdictText;
}
calculate();
</script>

</body>
</html>
